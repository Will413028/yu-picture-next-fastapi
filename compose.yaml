name: yu-picture-next-fastapi
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yupicture
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55479:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yupicture"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  database:
